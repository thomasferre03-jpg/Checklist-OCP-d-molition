<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thomas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const isGithubPages = window.location.hostname.endsWith('github.io')
        const hasDevEntry = document.querySelector('script[src="/src/main.tsx"]')

        if (!isGithubPages || !hasDevEntry) {
          return
        }

        const basePath = '/Checklist-OCP-d-molition/'
        const stylesheet = document.createElement('link')
        stylesheet.rel = 'stylesheet'
        stylesheet.href = `${basePath}assets/index.css`
        document.head.appendChild(stylesheet)

        const appScript = document.createElement('script')
        appScript.type = 'module'
        appScript.src = `${basePath}assets/index.js`
        document.body.appendChild(appScript)
      })()
    </script>
  </body>
</html>
